# For Coolify only (docs/coolify.md); on a server, use compose.yaml. Coolify
# reads this file from the branch `stable`, which is at the newest release.
#
# Keep it in step with compose.yaml. It differs only in three points: `web`
# publishes no port, only `expose:` 3000 (Coolify's proxy reaches it over the
# Docker network; assign the domain to `web`, port 3000), every deploy pulls
# the images again (the tag in BACKUPS_VERSION moves: a series such as 0.1,
# latest or preview), and `updater` calls Coolify's deploy link.
#
# PostgreSQL is a separate Coolify resource; set DATABASE_URL to its internal
# URL. The proxy must accept request bodies of 16 MiB (the agents' parts).

x-image: &image ghcr.io/meldgrove/backups:${BACKUPS_VERSION:?Set BACKUPS_VERSION to a release, e.g. 0.1.0}

# Every variable in .env reaches the containers (docs/configuration.md); the
# required ones are checked here so a missing value stops the start.
x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  APP_URL: ${APP_URL:?Set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
  # Schedules and the daily upkeep follow this time zone.
  TZ: ${TZ:-UTC}
  # The reverse proxy in front of the app sets X-Forwarded-For.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # The update button of admins asks the updater service below, with this
  # token (openssl rand -hex 32), which the updater then requires.
  UPDATER_URL: ${UPDATER_URL:-http://updater:8080}
  UPDATER_TOKEN: ${UPDATER_TOKEN:-}

x-app: &app
  image: *image
  pull_policy: always
  env_file:
    - path: .env
      required: false
  environment: *app-environment

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    # `docker compose run --rm -T migrate cli …` (the operator command) works
    # on the same local copies and restic cache as web and worker.
    volumes:
      - data:/data

  web:
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - data:/data
    # Coolify takes the proxy port from here when the domain names none.
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/-/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - data:/data
    healthcheck:
      # The worker touches the file every few seconds while it runs.
      test:
        - CMD
        - node
        - -e
        - "const s = require('node:fs').statSync('/tmp/worker-heartbeat', { throwIfNoEntry: false }); process.exit(s && Date.now() - s.mtimeMs < 60000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Automatic updates and the update button of admins (docs/coolify.md). With
  # UPDATE_DEPLOY_HOOK_URL set, it calls Coolify's deploy link when the tag in
  # BACKUPS_VERSION points to a new image: the tag decides what installs, so
  # admins cannot choose the channel in the app. Only the app reaches its API:
  # never publish a port.
  # With UPDATER_TOKEN set, its API takes only requests that carry the token.
  updater:
    image: ghcr.io/meldgrove/updater:0.2
    pull_policy: always
    restart: unless-stopped
    environment:
      IMAGE: *image
      VERSION_VARIABLE: BACKUPS_VERSION
      API_TOKEN: ${UPDATER_TOKEN:-}
      # A stable release installs once it has been out this long; every
      # automatic install only inside the window, if one is set (e.g.
      # 02:00-05:00, in the time zone TZ).
      COOLDOWN: ${UPDATE_COOLDOWN:-3d}
      WINDOW: ${UPDATE_WINDOW:-}
      TZ: ${TZ:-UTC}
      # Only while the image is private: a GitHub user and a token with
      # read:packages.
      REGISTRY_USERNAME: ${UPDATE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${UPDATE_REGISTRY_PASSWORD:-}
      DEPLOY_HOOK_URL: ${UPDATE_DEPLOY_HOOK_URL:-}
      DEPLOY_HOOK_TOKEN: ${UPDATE_DEPLOY_HOOK_TOKEN:-}
    volumes:
      - updater:/trigger

volumes:
  data:
  updater:
